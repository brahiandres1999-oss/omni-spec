<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Materials -->
    <linearGradient id="omni-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="omni-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="omni-sage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="omni-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Base Plinth Foundation Gradient: Obsidian Titanium -->
    <linearGradient id="omni-plinth-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Bevel Rim for high contrast against dark & light taskbars -->
    <linearGradient id="omni-plinth-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Ambient Glow beneath the jewel -->
    <radialGradient id="omni-jewel-glow" cx="0" cy="-2" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Multi-stage drop shadow for deep Windows 11 elevation -->
    <filter id="omni-elevation" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.80"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Centered and maximized to fill the full icon canvas (optical presence = 100%) -->
  <g transform="translate(128, 126) scale(1.78)" filter="url(#omni-elevation)">
    <!-- Base Plinth Structure -->
    <polygon points="0,-22 68,17 0,56 -68,17" fill="url(#omni-plinth-top)" stroke="url(#omni-plinth-rim)" stroke-width="1.6"/>
    <polygon points="-68,17 0,56 0,66 -68,27" fill="#131B27" stroke="#253243" stroke-width="1.1"/>
    <polygon points="0,56 68,17 68,27 0,66" fill="#0A0F17" stroke="#253243" stroke-width="1.1"/>

    <!-- Subtle Ambient Core Warmth -->
    <circle cx="0" cy="-2" r="28" fill="url(#omni-jewel-glow)"/>

    <!-- 1. FEATURE / Steel Cobalt Quadrant (Top) -->
    <g transform="translate(0, -22)">
      <polygon points="0,-40 32,-21 0,-2 -32,-21" fill="url(#omni-steel)" stroke="#BFDBFE" stroke-width="1.2"/>
      <polygon points="-32,-21 0,-2 0,8 -32,-11" fill="#2563EB" opacity="0.95"/>
      <polygon points="0,-2 32,-21 32,-11 0,8" fill="#1D4ED8" opacity="0.95"/>
    </g>

    <!-- 2. BUGFIX / Warm Amber Copper Quadrant (Right) -->
    <g transform="translate(30, -5)">
      <polygon points="0,-28 28,-10 0,8 -28,-10" fill="url(#omni-copper)" stroke="#FDE68A" stroke-width="1.2"/>
      <polygon points="-28,-10 0,8 0,17 -28,-1" fill="#D97706" opacity="0.95"/>
      <polygon points="0,8 28,-10 28,-1 0,17" fill="#B45309" opacity="0.95"/>
    </g>

    <!-- 3. TECH DEBT / Sage Mint Quadrant (Bottom) -->
    <g transform="translate(0, 12)">
      <polygon points="0,-16 28,1 0,18 -28,1" fill="url(#omni-sage)" stroke="#BBF7D0" stroke-width="1.2"/>
      <polygon points="-28,1 0,18 0,25 -28,8" fill="#16A34A" opacity="0.95"/>
      <polygon points="0,18 28,1 28,8 0,25" fill="#15803D" opacity="0.95"/>
    </g>

    <!-- 4. RFC / ADR / Titanium Slate Quadrant (Left) -->
    <g transform="translate(-30, -5)">
      <polygon points="0,-28 28,-10 0,8 -28,-10" fill="url(#omni-titanium)" stroke="#FFFFFF" stroke-width="1.2"/>
      <polygon points="-28,-10 0,8 0,17 -28,-1" fill="#64748B" opacity="0.95"/>
      <polygon points="0,8 28,-10 28,-1 0,17" fill="#475569" opacity="0.95"/>
    </g>

    <!-- Central Gate Aperture & Brilliant Jewel -->
    <polygon points="0,-12 18,-2 0,8 -18,-2" fill="#0B1017" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="-2" r="5" fill="#F59E0B"/>
    <circle cx="0" cy="-2" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
