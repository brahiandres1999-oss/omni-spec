<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Pure Professional Obsidian Black Canvas (Zero Generic Blue) -->
    <linearGradient id="bn-obsidian" x1="0" y1="0" x2="980" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0A0A0D"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>

    <linearGradient id="bn-frame" x1="0" y1="0" x2="980" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>

    <radialGradient id="bn-ambient" cx="148" cy="130" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#FAFAFA" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>

    <!-- Matching Refined Octagonal Emblem Gradients -->
    <linearGradient id="bn-chassis" x1="-110" y1="-110" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="55%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="bn-rim" x1="-110" y1="-110" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>

    <linearGradient id="bn-north" x1="0" y1="-88" x2="0" y2="-20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="bn-west" x1="-88" y1="0" x2="-20" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>

    <linearGradient id="bn-south" x1="0" y1="88" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>

    <linearGradient id="bn-east" x1="88" y1="0" x2="20" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="bn-core" x1="-14" y1="-14" x2="14" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Black Executive Canvas -->
  <rect x="1" y="1" width="978" height="258" rx="14" fill="url(#bn-obsidian)" stroke="url(#bn-frame)" stroke-width="1.5"/>
  <rect x="1" y="1" width="978" height="258" rx="14" fill="url(#bn-ambient)"/>

  <!-- Subtle Neutral Structural Separator -->
  <line x1="274" y1="44" x2="274" y2="216" stroke="#1E1E22" stroke-width="1"/>

  <!-- Left Mark: Refined Original OmniSpec Octagonal Emblem -->
  <g transform="translate(144, 130) scale(0.74)">
    <polygon
      points="-48,-114 48,-114 114,-48 114,48 48,114 -48,114 -114,48 -114,-48"
      fill="url(#bn-chassis)"
      stroke="url(#bn-rim)"
      stroke-width="3"
      stroke-linejoin="miter"
    />
    <polygon
      points="-43,-102 43,-102 102,-43 102,43 43,102 -43,102 -102,43 -102,-43"
      fill="#060608"
      stroke="#1E1E22"
      stroke-width="1.5"
    />

    <!-- Four Converging Facets -->
    <polygon points="0,-86 42,-44 15,-25 -15,-25 -42,-44" fill="url(#bn-north)"/>
    <polygon points="-86,0 -44,-42 -25,-15 -25,15 -44,42" fill="url(#bn-west)"/>
    <polygon points="0,86 -42,44 -15,25 15,25 42,44" fill="url(#bn-south)"/>
    <polygon points="86,0 44,42 25,15 25,-15 44,-42" fill="url(#bn-east)"/>

    <!-- Central Diamond Verification Gate -->
    <polygon
      points="0,-36 36,0 0,36 -36,0"
      fill="#050507"
      stroke="#F59E0B"
      stroke-width="3.2"
      stroke-linejoin="miter"
    />
    <polygon points="0,-18 18,0 0,18 -18,0" fill="url(#bn-core)"/>
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#050507"/>
  </g>

  <!-- Right Editorial Wordmark & Capabilities -->
  <g transform="translate(314, 48)">
    <text x="2" y="16" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#F59E0B">
      RELEASE 0.10.0  ·  UNIVERSAL AGENTIC ENGINEERING ENGINE
    </text>

    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.8" fill="#FAFAFA">
      Omni<tspan fill="#F59E0B">Spec</tspan>
    </text>

    <text x="2" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D4D4D8" letter-spacing="0.1">
      Proportional Contracts · Polyglot AST Cartography · Cryptographic Gates
    </text>

    <line x1="2" y1="138" x2="612" y2="138" stroke="#222227" stroke-width="1"/>

    <text x="2" y="162" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.5" fill="#A1A1AA">
      ZERO RUNTIME DEPS   ·   SQLITE + FTS5   ·   LAMPORT LOCKS   ·   HMAC-SHA256   ·   OMNI-DESIGN
    </text>
  </g>
</svg>
