<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background: Deep Obsidian Slate -->
    <linearGradient id="icon-bg-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>

    <!-- Subtle Technical Bevel -->
    <linearGradient id="icon-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484F58"/>
      <stop offset="50%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#21262D"/>
    </linearGradient>

    <!-- Natural Materials -->
    <linearGradient id="icon-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="icon-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>

    <linearGradient id="icon-sage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>

    <linearGradient id="icon-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </linearGradient>

    <filter id="icon-elevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base Container: Premium Rounded Obsidian Token -->
  <rect x="4" y="4" width="248" height="248" rx="54" fill="url(#icon-bg-slate)" stroke="url(#icon-edge)" stroke-width="2"/>

  <!-- Precision Caliper Ring & Compass Marks -->
  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#21262D" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="3,6"/>

    <!-- Caliper Ticks -->
    <g stroke="#484F58" stroke-width="1.2">
      <line x1="0" y1="-92" x2="0" y2="-84"/>
      <line x1="0" y1="92" x2="0" y2="84"/>
      <line x1="-92" y1="0" x2="-84" y2="0"/>
      <line x1="92" y1="0" x2="84" y2="0"/>
      <line x1="65" y1="-65" x2="59" y2="-59"/>
      <line x1="-65" y1="-65" x2="-59" y2="-59"/>
      <line x1="65" y1="65" x2="59" y2="59"/>
      <line x1="-65" y1="65" x2="-59" y2="59"/>
    </g>

    <!-- ARCHITECTURAL PLINTH & 4 ARCHETYPES -->
    <g filter="url(#icon-elevation)">
      <!-- Isometric Base Plinth (Constitution Slab) -->
      <polygon points="0,-22 68,17 0,56 -68,17" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <polygon points="-68,17 0,56 0,66 -68,27" fill="#0D1117" stroke="#21262D" stroke-width="1.2"/>
      <polygon points="0,56 68,17 68,27 0,66" fill="#080B0F" stroke="#21262D" stroke-width="1.2"/>

      <!-- Top Quadrant: FEATURE (Steel/Cobalt) -->
      <g transform="translate(0, -22)">
        <polygon points="0,-40 32,-21 0,-2 -32,-21" fill="url(#icon-steel)" stroke="#79C0FF" stroke-width="1"/>
        <polygon points="-32,-21 0,-2 0,8 -32,-11" fill="#1F6FEB" opacity="0.95"/>
        <polygon points="0,-2 32,-21 32,-11 0,8" fill="#1158C7" opacity="0.95"/>
      </g>

      <!-- Right Quadrant: BUGFIX (Warm Amber / Copper) -->
      <g transform="translate(30, -5)">
        <polygon points="0,-28 28,-10 0,8 -28,-10" fill="url(#icon-copper)" stroke="#FCD34D" stroke-width="1"/>
        <polygon points="-28,-10 0,8 0,17 -28,-1" fill="#B45309" opacity="0.95"/>
        <polygon points="0,8 28,-10 28,-1 0,17" fill="#92400E" opacity="0.95"/>
      </g>

      <!-- Bottom Quadrant: TECH DEBT (Sage / Olive) -->
      <g transform="translate(0, 12)">
        <polygon points="0,-16 28,1 0,18 -28,1" fill="url(#icon-sage)" stroke="#7EE787" stroke-width="1"/>
        <polygon points="-28,1 0,18 0,25 -28,8" fill="#238636" opacity="0.95"/>
        <polygon points="0,18 28,1 28,8 0,25" fill="#196C2E" opacity="0.95"/>
      </g>

      <!-- Left Quadrant: RFC / ADR (Titanium / Slate) -->
      <g transform="translate(-30, -5)">
        <polygon points="0,-28 28,-10 0,8 -28,-10" fill="url(#icon-titanium)" stroke="#FFFFFF" stroke-width="1"/>
        <polygon points="-28,-10 0,8 0,17 -28,-1" fill="#6E7681" opacity="0.95"/>
        <polygon points="0,8 28,-10 28,-1 0,17" fill="#484F58" opacity="0.95"/>
      </g>

      <!-- Central Gate Aperture & Focal Jewel -->
      <polygon points="0,-12 18,-2 0,8 -18,-2" fill="#0D1117" stroke="#E3A048" stroke-width="1.8"/>
      <circle cx="0" cy="-2" r="4.5" fill="#F59E0B"/>
      <circle cx="0" cy="-2" r="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
