<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Pure Obsidian Machined Housing (Zero Generic Blue) -->
    <linearGradient id="omni-chassis" x1="20" y1="16" x2="236" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="55%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="omni-rim" x1="20" y1="16" x2="236" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>

    <radialGradient id="omni-interior-glow" cx="128" cy="128" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#18181B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>

    <!-- Refined Directional Facets: Machined Titanium / Graphite / Molten Amber -->
    <!-- North: Specify / Blueprint (Crisp Platinum-White Titanium) -->
    <linearGradient id="facet-north" x1="128" y1="40" x2="128" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <!-- West: Memory / Contracts (Brushed Silver Steel) -->
    <linearGradient id="facet-west" x1="40" y1="128" x2="108" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>

    <!-- South: Guard / Converge (Anodized Dark Graphite) -->
    <linearGradient id="facet-south" x1="128" y1="216" x2="128" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>

    <!-- East: Verify / Attest (Signature Molten Amber Gold) -->
    <linearGradient id="facet-east" x1="216" y1="128" x2="148" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="core-amber" x1="114" y1="114" x2="142" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Chamfered Octagonal Architectural Housing -->
  <polygon
    points="80,14 176,14 242,80 242,176 176,242 80,242 14,176 14,80"
    fill="url(#omni-chassis)"
    stroke="url(#omni-rim)"
    stroke-width="2.5"
    stroke-linejoin="miter"
  />

  <!-- Inner Obsidian Well -->
  <polygon
    points="85,26 171,26 230,85 230,171 171,230 85,230 26,171 26,85"
    fill="#060608"
    stroke="#1E1E22"
    stroke-width="1.2"
  />
  <polygon
    points="85,26 171,26 230,85 230,171 171,230 85,230 26,171 26,85"
    fill="url(#omni-interior-glow)"
  />

  <!-- Four Directional Engineering Prisms (Clean Architectural Separation) -->
  <!-- North -->
  <polygon points="128,42 170,84 143,103 113,103 86,84" fill="url(#facet-north)"/>
  <!-- West -->
  <polygon points="42,128 84,86 103,113 103,143 84,170" fill="url(#facet-west)"/>
  <!-- South -->
  <polygon points="128,214 86,172 113,153 143,153 170,172" fill="url(#facet-south)"/>
  <!-- East -->
  <polygon points="214,128 172,170 153,143 153,113 172,86" fill="url(#facet-east)"/>

  <!-- Precision Central Verification Gate Diamond -->
  <polygon
    points="128,92 164,128 128,164 92,128"
    fill="#050507"
    stroke="#F59E0B"
    stroke-width="3"
    stroke-linejoin="miter"
  />

  <!-- Sculpted Amber Focal Core -->
  <polygon points="128,110 146,128 128,146 110,128" fill="url(#core-amber)"/>
  <polygon points="128,121 135,128 128,135 121,128" fill="#050507"/>
</svg>
